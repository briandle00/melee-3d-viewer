<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Replay player, the game's draw path</title>
    <link rel="stylesheet" href="/src/gx.css" />
  </head>
  <body>
    <!-- The replay drawn by the game's own draw path: the simulator's graphics build plays the match and runs the game's display pass,
         and the GX renderer draws the commands it sends. Same parameters as embed.html where they apply (replayUrl, name, frame,
         files, paused), plus core (the module's URL), backend (gl or cpu), speed, playback (slippi or original) and pace (60 or console).
         Messages: load, seek (game frame), play, pause, toggle, gameFiles, speed, playback, pace. Nothing leaves the browser.
         Sound: a page that sets globalThis.__MELEE_AUDIO_CONFIG__ before this one loads gets the Sound button (README, "Optional
         browser audio"); without it there is none. -->
    <div id="app">
      <div id="stage"><div id="view"></div></div>
      <div id="files">
        <button id="pickfolder" title="The folder of game files extracted from your own copy of the game. The files are read here in the browser and never uploaded.">Choose Game Folder</button>
        <input id="pickfiles" type="file" multiple webkitdirectory hidden />
        <span id="filesnote"></span>
      </div>
      <div id="bar">
        <button id="play">Play</button>
        <button id="back" title="One frame back (starts the match again)">&#9664;|</button>
        <button id="fwd" title="One frame forward">|&#9654;</button>
        <span id="speeds"></span>
        <button id="playback" title="Slippi: the replay as Slippi's replay playback shows it. Original: as the console played it when the replay was recorded. Changing it plays the replay again from the start.">Playback: Slippi</button>
        <button id="pace" title="60: 60 frames a second, one frame per refresh on a 60 Hz screen. Console: 59.94 frames a second, the rate a GameCube runs at. Every frame is shown either way.">Speed: 60</button>
        <button id="crt" title="The TV the picture is shown on (a display layer: the picture itself is the same)">TV: Off</button>
        <button id="pads" title="Controllers drawn beside the HUD slots (a layer over the picture)">Controllers: Off</button>
        <button id="sound" hidden title="The game's sound">Sound: Off</button>
        <button id="music" hidden title="The game's music, on or off (the rest of the sound stays)">Music: On</button>
        <button id="export" aria-expanded="false">Export Video</button>
        <div id="seek"><div id="seekfill"></div></div>
        <span id="where"></span>
      </div>
      <div id="exportbox" hidden>
        <fieldset id="exportwhat">
          <legend>What</legend>
          <label><input type="radio" name="what" value="game" checked /> The whole game</label>
          <label><input type="radio" name="what" value="clip" /> Game frames <input id="exportfrom" type="number" step="1" /> to <input id="exportto" type="number" step="1" /></label>
        </fieldset>
        <fieldset id="exportsize">
          <legend>Size</legend>
          <label><input type="radio" name="size" value="1" checked /> 640 x 480 (the game's)</label>
          <label><input type="radio" name="size" value="2" /> 1280 x 960</label>
          <label><input type="radio" name="size" value="4" /> 2560 x 1920</label>
        </fieldset>
        <p id="exportnote">No sound yet. Every frame is drawn as the player draws it, with its Playback, Speed and TV, as fast as your graphics card allows. The video is made here in your browser and saved to your downloads; nothing is uploaded.</p>
        <div id="exportgo"><button id="exportstart">Make the Video</button> <button id="exportcancel" hidden>Cancel</button> <span id="exportstate"></span></div>
      </div>
      <div id="info"></div>
    </div>
    <script type="module" src="/src/gxpage.ts"></script>
  </body>
</html>
